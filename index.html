<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
    <link href="tailwind.css" rel="stylesheet">
    <script src="https://unpkg.com/idb@6.1.0/build/iife/index-min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@2.x/dist/full.css" rel="stylesheet" type="text/css" />
    <link href="dist/output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/idb@7/build/umd.js"></script>
    <!-- Add Masonry & imagesLoaded -->
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js" defer></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js" defer></script>
    <!-- Add UploadThing Client -->
    <script 
      src="https://unpkg.com/uploadthing@5.7.4/dist/uploadthing.js" 
      onload="console.log('UploadThing script loaded successfully');"
      onerror="console.error('Failed to load UploadThing script');">
    </script>
    <script>
      // Add this to debug what's available
      window.addEventListener('DOMContentLoaded', function() {
        console.log('UploadThing global object:', window.uploadthing);
        if (window.uploadthing) {
          console.log('Available methods:', Object.keys(window.uploadthing));
        } else {
          console.log('Available global objects:', Object.keys(window).filter(k => k.toLowerCase().includes('upload')));
        }
      });
    </script>
    <!-- End Add Libraries -->
    <style>
      /* Custom styles */
      .slider-container {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .number-input {
        width: 80px; /* Adjust as needed */
      }
      .image-container {
        position: relative;
        margin-bottom: 1rem;
      }
      .download-btn {
          position: absolute;
          bottom: 10px;
          right: 10px;
          opacity: 0.8;
          transition: opacity 0.2s ease-in-out;
      }
      .image-container:hover .download-btn {
          opacity: 1;
      }
      .history-entry img.thumbnail {
          width: 100%;
          height: auto;
          object-fit: cover;
          cursor: pointer;
          border-radius: 0.5rem;
          display: block;
      }
      .history-entry {
         position: relative;
         margin-bottom: 1rem;
         padding: 0 0.5rem;
         box-sizing: border-box;
      }
      .history-entry.w-1\/2 { width: 50%; }
      .history-entry.w-1\/3 { width: 33.3333%; }
      .history-entry.w-1\/4 { width: 25%; }
      .history-entry.w-1\/6 { width: 16.6666%; }
      .history-delete-btn {
          position: absolute;
          top: 4px;
          right: 4px;
          background-color: rgba(255, 0, 0, 0.6);
          color: white;
          border: none;
          border-radius: 50%;
          width: 24px;
          height: 24px;
          font-size: 14px;
          line-height: 24px;
          text-align: center;
          cursor: pointer;
          opacity: 0;
          transition: opacity 0.2s ease-in-out;
          z-index: 5;
      }
      .history-entry:hover .history-delete-btn {
          opacity: 1;
      }
      #history {
        /* Masonry will handle layout */
        /* Add some basic styles needed for Masonry */
      }
      
      /* --- Modal Styling Adjustments --- */
      .modal-box { 
        max-height: 95vh;
        display: flex;
        flex-direction: column;
        padding: 0 !important;
      }

      #modalImage {
          display: block;
          max-width: 100%;
          max-height: 75vh;
          width: auto;
          height: auto;
          margin: 0 auto;
          object-fit: contain;
          flex-shrink: 0;
      }

      .modal-details {
          padding: 1rem;
          background-color: var(--fallback-b1, oklch(var(--b1) / 1));
          color: var(--fallback-bc, oklch(var(--bc) / 1));
          overflow-y: auto;
          flex-grow: 1;
          margin-top: 0.5rem;
          border-top: 1px solid oklch(var(--b3));
      }
       .modal-details p {
          margin-bottom: 0.5rem;
      }

      .modal-action {
          padding: 1rem;
          border-top: 1px solid oklch(var(--b3));
          flex-shrink: 0;
      }
      /* --- End Modal Styling Adjustments --- */

      /* --- Style for Result Image Height --- */
      #imagePlaceholder .image-container img {
        max-height: 85vh;
        width: auto;
        height: auto;
        display: block;
        margin-left: auto;
        margin-right: auto;
      }
      /* --- End Style --- */

      /* --- Image Preview Styling --- */
      #imagePreview {
        max-height: 200px;
        max-width: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        margin-top: 10px;
        margin-bottom: 10px;
      }
      #imageUploadContainer {
        margin-bottom: 20px;
      }
      /* --- End Image Preview Styling --- */
      
      /* --- Clipboard Paste Styling --- */
      .paste-enabled {
        outline: 2px dashed transparent;
        transition: all 0.2s ease;
      }
      .paste-enabled:focus {
        outline: 2px dashed var(--primary);
        outline-offset: 4px;
      }
      .paste-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        font-size: 14px;
        color: var(--primary-content);
        background-color: var(--primary);
        border-radius: 4px;
        margin-top: 8px;
        opacity: 0.8;
        transition: all 0.2s ease;
      }
      .paste-indicator.pulse {
        animation: pulse-animation 1s ease;
      }
      .paste-success {
        background-color: #4CAF50;
        color: white;
        padding: 8px;
        border-radius: 4px;
        text-align: center;
        margin-top: 8px;
      }
      @keyframes pulse-animation {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }
      /* --- End Clipboard Paste Styling --- */

    </style>
</head>
<body class="bg-base-200">
    <div class="container mx-auto p-4">
           <!-- Removed link to history page -->
           <!-- <a href="history.html">View History</a> -->
           <!-- Add link to video page -->
           <a href="video.html" class="link link-primary mb-4 inline-block">Go to Video Generation</a>

        <div class="grid grid-cols-2 gap-4">
            <div class="input-section">
                <h2 class="text-2xl font-bold mb-2">Input</h2>
                <form id="generationForm">
                    <div class="form-group mb-4">
                        <label class="label">
                            <span class="label-text">Select Model Endpoint</span>
                        </label>
                        <select id="modelSelect" name="model" class="select select-bordered w-full">
                            <option value="">Select an endpoint</option>
                            <!-- Options populated by loadModels() -->
                        </select>
                    </div>

                    <!-- Base Model Dropdown (Initially Hidden, shown for fal-ai/lora) -->
                    <div id="baseModelContainer" class="form-group mb-4" style="display: none;">
                        <label class="label">
                            <span class="label-text">Select Base Model (for LoRA endpoint)</span>
                        </label>
                        <select id="baseModelSelect" name="baseModelName" class="select select-bordered w-full">
                            <option value="stabilityai/stable-diffusion-xl-base-1.0" selected>SDXL 1.0 Base</option>
                            <option value="runwayml/stable-diffusion-v1-5">SD 1.5</option>
                            <option value="SG161222/Realistic_Vision_V2.0">Realistic Vision V2.0 (SD 1.5)</option>
                            <!-- Add a custom option later if needed -->
                        </select>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text">Prompt*</span>
                        </label>
                        <textarea id="prompt" name="prompt" rows="4" required class="textarea textarea-bordered w-full"></textarea>
                    </div>

                    <!-- Input Image Element -->
                    <div id="imageUploadContainer" class="mb-4" style="display: none;">
                        <label for="imageUploadInput" class="block text-sm font-medium mb-1">Input Image (for Image-to-Image):</label>
                        <div class="flex flex-col space-y-2 bg-base-200 p-3 rounded-lg">
                            <div class="flex items-center justify-between">
                                <input type="file" id="imageUploadInput" name="imageUploadInput" class="file-input file-input-bordered file-input-primary w-full max-w-xs" accept="image/*">
                                <div class="text-sm opacity-70 flex items-center" title="You can also paste image from clipboard">
                                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                  </svg>
                                  Paste (Ctrl+V)
                                </div>
                            </div>
                            <div id="pasteTarget" class="border-2 border-dashed border-base-300 rounded-lg p-4 text-center cursor-pointer hover:bg-base-300/30 transition-colors">
                                <span class="text-sm">Drop image here or click to paste from clipboard</span>
                            </div>
                            <div id="uploadProgress" class="hidden mt-2">
                                <div class="flex items-center">
                                    <div class="loading loading-spinner loading-xs mr-2"></div>
                                    <span id="uploadStatus" class="text-sm">Uploading...</span>
                                </div>
                                <progress id="uploadProgressBar" class="progress progress-primary w-full mt-1" value="0" max="100"></progress>
                            </div>
                            <div class="image-preview-container flex justify-start">
                                <img id="imagePreview" src="#" alt="Image Preview" class="hidden rounded border"/>
                            </div>
                            <input type="hidden" id="uploadedImageUrl" name="uploadedImageUrl" value="">
                        </div>
                    </div>

                    <!-- Strength Slider Element -->
                    <div id="strengthContainer" class="mb-4" style="display: none;">
                        <label for="strengthSlider" class="block text-sm font-medium mb-1">
                            Transformation Strength
                        </label>
                        <div class="bg-base-200 p-3 rounded-lg">
                            <div class="flex items-center mb-2">
                                <span class="text-sm mr-2">Subtler</span>
                                <div class="flex-grow">
                                    <input type="range" id="strengthSlider" name="strengthSlider" min="0.01" max="1.0" step="0.01" value="0.95" class="range range-sm range-primary">
                                </div>
                                <span class="text-sm ml-2">Stronger</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center">
                                    <span class="font-medium text-sm mr-2">Strength:</span>
                                    <span id="strengthValue" class="badge badge-primary">0.95</span>
                                </div>
                                <input type="number" id="strengthInput" name="strengthInput" min="0.01" max="1.0" step="0.01" value="0.95" class="input input-bordered input-sm input-primary w-20">
                            </div>
                            <div class="text-xs mt-2 text-base-content/70">
                                Higher values produce more dramatic changes to the original image.
                            </div>
                        </div>
                    </div>

                    <div class="additional-settings">
                        <h3 class="text-lg font-bold mb-2">Additional Settings</h3>
                        <!-- Image Size Dropdown (Initially Visible) -->
                        <div id="imageSizeContainer" class="form-group mb-4">
                            <label class="label">
                                <span class="label-text">Image Size</span>
                            </label>
                            <select id="imageSize" name="imageSize" class="select select-bordered w-full">
                                <!-- Reverted to string values expected by fal-ai/lora -->
                                <option value="square_hd" selected>Square HD (1024x1024)</option> 
                                <option value="square">Square (512x512)</option> 
                                <option value="landscape_16_9">Landscape 16:9</option>
                                <option value="landscape_4_3">Landscape 4:3</option>
                                <option value="portrait_16_9">Portrait 16:9</option>
                                <option value="portrait_4_3">Portrait 4:3</option>
                                <!-- Add others from the error message if needed, e.g.: -->
                                <!-- <option value="portrait_other">Portrait Other</option> --> 
                                <!-- <option value="landscape_other">Landscape Other</option> -->
                            </select>
                        </div>

                        <!-- Aspect Ratio Dropdown (Initially Hidden) -->
                        <div id="aspectRatioContainer" class="form-group mb-4" style="display: none;">
                            <label class="label">
                                <span class="label-text">Aspect Ratio</span>
                            </label>
                            <select id="aspectRatio" name="aspectRatio" class="select select-bordered w-full">
                                <option value="21:9">21:9</option>
                                <option value="16:9" selected>16:9</option>
                                <option value="4:3">4:3</option>
                                <option value="1:1">1:1</option>
                                <option value="3:4">3:4</option>
                                <option value="9:16">9:16</option>
                                <option value="9:21">9:21</option>
                            </select>
                        </div>

                        <div class="form-group mb-4">
                            <label class="label">
                                <span class="label-text">Num Inference Steps</span>
                            </label>
                            <div class="slider-container">
                                <input type="range" id="numStepsSlider" name="numSteps" min="1" max="50" value="28" class="slider w-full">
                                <input type="number" id="numStepsInput" name="numSteps" min="1" max="50" value="28" class="number-input input input-bordered w-sm max-w-xs">
                            </div>
                        </div>
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">Seed</span>
                            </label>
                            <input type="text" id="seed" name="seed" value="random" class="input input-bordered w-full">
                        </div>
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">LoRA URL</span>
                            </label>
                            <input type="text" id="loraUrl" name="loraUrl" class="input input-bordered w-full">
                        </div>
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">LoRA Scale</span>
                            </label>
                            <input type="number" id="loraScale" name="loraScale" min="0" step="0.1" value="1" class="input input-bordered w-full">
                        </div>
                        <div class="form-group mb-4">
                            <label class="label">
                                <span class="label-text">Guidance Scale (CFG)</span>
                            </label>
                            <div class="slider-container">
                                <input type="range" id="guidanceScaleSlider" name="guidanceScale" min="1" max="10" value="3.5" step="0.1" class="slider w-full">
                                <input type="number" id="guidanceScaleInput" name="guidanceScale" min="1" max="10" value="3.5" step="0.1" class="number-input input input-bordered w-sm max-w-xs">
                            </div>
                        </div>
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">Num Images</span>
                            </label>
                            <input type="number" id="numImages" name="numImages" value="1" min="1" max="4" class="input input-bordered w-full">
                        </div>
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">Enable Safety Checker</span>
                            </label>
                            <input type="checkbox" id="enableSafetyChecker" name="enableSafetyChecker" class="checkbox">
                        </div>
                    </div>

                    <button id="generateBtn" type="submit" class="btn btn-primary">
                        Generate
                        <span id="loadingSpinner" class="loading loading-spinner" style="display: none;"></span>
                    </button>
                </form>
            </div>
            <div class="result-section">
                <h2 class="text-2xl font-bold mb-2">Result</h2>
                <div class="image-display mb-4">
                    <div id="imagePlaceholder" class="imagePlaceholder grid grid-cols-1 gap-4">
                        <!-- Placeholder for multiple images -->
                    </div>
                    <button id="prevBtn" class="btn btn-secondary" style="display: none;">❮</button>
                    <button id="nextBtn" class="btn btn-secondary" style="display: none;">❯</button>
                </div>
                <div class="logs-section flex flex-col justify-end h-64 overflow-y-auto">
                    <div id="logs" class="p-2 bg-base-100 rounded-box"></div>
                </div>
            </div>
        </div>

        <!-- New Wrapper for History Controls and Grid -->
        <div class="history-wrapper relative mt-4"> 
            <!-- History Section Controls (Moved Top Right) -->
            <div class="history-controls absolute top-0 right-0 p-2 z-10 bg-base-100 rounded-box shadow"> 
                <label for="thumbnailSizeSlider" class="label py-1 text-xs"> 
                    <span class="label-text">Size (<span id="thumbnailSizeLabel">Medium</span>)</span> 
                </label>
                <!-- Updated Slider for 4 sizes -->
                <input type="range" id="thumbnailSizeSlider" min="1" max="4" value="2" step="1" class="range range-xs range-primary align-middle" style="width: 100px;"> 
            </div>
            <!-- End History Section Controls -->

            <!-- History Grid (Masonry Style) -->
            <div id="history" class="history-section gap-4 pt-12"> 
                <!-- Removed grid class, using CSS columns -->
                <!-- History thumbnails will be appended here -->
            </div>
        </div> 
        <!-- End History Wrapper -->

    </div>

    <!-- DaisyUI Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-box w-10/12 max-w-4xl p-0" style="padding: 0px !important;">
            <img id="modalImage" src="" alt="Generated Image" class="w-full">
            <div class="modal-details">
                <p id="modalPrompt"></p>
                <p id="modalSeed"></p>
                <p id="modalNSFW"></p>
                <p id="modalTimings"></p>
            </div>
            <div class="modal-action">
                <button id="downloadBtn" class="btn btn-primary">Download</button>
                <button id="reusePromptBtn" class="btn btn-secondary">Reuse Prompt</button>
                <button id="closeModalBtn" class="btn">Close</button>
            </div>
        </div>
    </div>

 

    <script src="script.js"></script>
</body>
</html>
