<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Generator</title>
    <!-- Using same CSS setup as index.html -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@2.x/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add Masonry & imagesLoaded -->
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js" defer></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js" defer></script>
    <link href="dist/output.css" rel="stylesheet"> 
    <style>
      /* Custom styles (can add more specific video styles later) */
      .preview-image { max-height: 200px; width: auto; margin-top: 10px; border-radius: 0.5rem; }
      #videoPlaceholder video { max-width: 100%; height: auto; max-height: 70vh; display: block; margin: 0 auto; }
      .file-input-bordered { border-style: solid; } /* Ensure border shows */

      .history-entry { 
         break-inside: avoid-column; 
         page-break-inside: avoid; 
         -webkit-column-break-inside: avoid; 
         position: relative; 
         display: inline-block; 
         width: 100%;
         margin-bottom: 1rem; 
         padding: 0 0.5rem; 
         box-sizing: border-box; 
      }
      /* Width classes controlled by JS */
      .history-entry.w-1\/2 { width: 50%; }
      .history-entry.w-1\/3 { width: 33.3333%; }
      .history-entry.w-1\/4 { width: 25%; }
      .history-entry.w-1\/6 { width: 16.6666%; }

      .history-entry img.thumbnail, /* Target img */
      .history-entry video.thumbnail /* Target video */ {
          width: 100%;
          height: auto;
          object-fit: cover; 
          cursor: pointer;
          border-radius: 0.5rem;
          display: block; 
      }
      
      .history-delete-btn {
          position: absolute;
          top: 4px;
          right: 4px;
          background-color: rgba(255, 0, 0, 0.6); 
          color: white;
          border: none;
          border-radius: 50%; 
          width: 24px;
          height: 24px;
          font-size: 14px;
          line-height: 24px; 
          text-align: center;
          cursor: pointer;
          opacity: 0; 
          transition: opacity 0.2s ease-in-out;
          z-index: 5; 
      }
      .history-entry:hover .history-delete-btn { opacity: 1; }

      #videoHistory { /* Adjusted ID */
        column-count: var(--history-column-count, 4); 
        column-gap: 1rem; 
      }
      /* Modal styles */
      .modal-box { max-height: 95vh; display: flex; flex-direction: column; padding: 0 !important; }
      #modalVideo { /* Adjusted ID */
          display: block; max-width: 100%; max-height: 75vh; width: auto; height: auto; margin: 0 auto; object-fit: contain; flex-shrink: 0; 
      }
      .modal-details { padding: 1rem; background-color: var(--fallback-b1, oklch(var(--b1) / 1)); color: var(--fallback-bc, oklch(var(--bc) / 1)); overflow-y: auto; flex-grow: 1; margin-top: 0.5rem; border-top: 1px solid oklch(var(--b3)); }
      .modal-details p { margin-bottom: 0.5rem; }
      .modal-action { padding: 1rem; border-top: 1px solid oklch(var(--b3)); flex-shrink: 0; }
    </style>
</head>
<body class="bg-base-200">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">Video Generation</h1>
        <!-- Link back to image generator -->
        <a href="index.html" class="link link-primary mb-4 inline-block">Back to Image Generation</a>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Input Section -->
            <div class="input-section">
                <h2 class="text-2xl font-bold mb-2">Input</h2>
                <form id="videoGenerationForm">
                    <!-- Model Selection -->
                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text">Select Video Model</span>
                        </label>
                        <select id="videoModelSelect" name="model" class="select select-bordered w-full">
                            <option value="">Select a model</option>
                            <!-- Options populated by JS -->
                        </select>
                    </div>

                    <!-- Prompt -->
                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text">Prompt*</span>
                        </label>
                        <textarea id="prompt" name="prompt" rows="4" required class="textarea textarea-bordered w-full"></textarea>
                    </div>

                    <!-- Image Input (for Image-to-Video) -->
                    <div id="imageInputContainer" class="form-control mb-4" style="display: none;"> 
                        <label class="label">
                            <span class="label-text">Input Image*</span>
                        </label>
                        <input type="file" id="imageInput" name="imageFile" required accept="image/jpeg, image/png, image/webp, image/gif, image/avif" class="file-input file-input-bordered file-input-primary w-full" />
                        <div class="mt-2">
                            <img id="imagePreview" src="" alt="Image Preview" class="preview-image hidden"/>
                        </div>
                    </div>
                    
                    <!-- Additional Settings (Example: Seed) -->
                    <div class="additional-settings mt-4">
                        <h3 class="text-lg font-bold mb-2">Additional Settings</h3>
                         <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">Seed (Optional)</span>
                            </label>
                            <input type="text" id="seed" name="seed" value="random" class="input input-bordered w-full">
                        </div>
                        <!-- Add more inputs for fps, duration, motion_bucket_id etc. as needed -->
                    </div>

                    <button id="generateBtn" type="submit" class="btn btn-primary mt-4">
                        Generate Video
                        <span id="loadingSpinner" class="loading loading-spinner" style="display: none;"></span>
                    </button>
                </form>
            </div>

            <!-- Result Section -->
            <div class="result-section">
                <h2 class="text-2xl font-bold mb-2">Result</h2>
                <div id="videoPlaceholder" class="mb-4 bg-base-100 rounded-box flex justify-center items-center min-h-[300px]">
                   <p class="text-base-content text-opacity-60">Video will appear here</p> 
                   <!-- Video tag will be added here by JS -->
                </div>
                <h3 class="text-lg font-bold mb-2">Logs</h3>
                <div class="logs-section flex flex-col justify-end h-64 overflow-y-auto bg-base-100 rounded-box">
                    <div id="logs" class="p-2"></div>
                </div>
            </div>
        </div>

        <!-- History Section (Copied & Modified) -->
        <div class="history-wrapper relative mt-8 border-t pt-4"> 
             <h2 class="text-2xl font-bold mb-2">History</h2>
            <!-- History Controls -->
            <div class="history-controls absolute top-4 right-0 p-2 z-10 bg-base-100 rounded-box shadow"> 
                <label for="thumbnailSizeSlider" class="label py-1 text-xs"> 
                    <span class="label-text">Size (<span id="thumbnailSizeLabel">Medium</span>)</span> 
                </label>
                <input type="range" id="thumbnailSizeSlider" min="1" max="4" value="2" step="1" class="range range-xs range-primary align-middle" style="width: 100px;"> 
            </div>
            <!-- History Grid -->
            <div id="videoHistory" class="history-section gap-4 pt-12"> 
                <!-- History thumbnails will be appended here by JS -->
            </div>
        </div> 
        <!-- End History Section -->

    </div> <!-- End Container -->

    <!-- Video Modal (Copied & Modified) -->
    <div class="modal" id="videoModal"> 
        <div class="modal-box w-11/12 max-w-5xl"> <!-- Adjusted size -->
            <video id="modalVideo" src="" controls autoplay loop muted playsinline class="w-full"></video> <!-- Video tag -->
            <div class="modal-details">
                <p id="modalPrompt"></p>
                <p id="modalSeed"></p>
                <!-- Add other relevant video details here if available -->
            </div>
            <div class="modal-action">
                <button id="reusePromptBtn" class="btn btn-secondary">Reuse Prompt</button>
                <button id="closeModalBtn" class="btn">Close</button>
            </div>
        </div>
    </div>

    <script src="video.js"></script> 
</body>
</html>
